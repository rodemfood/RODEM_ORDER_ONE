<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#188754"><title>RODEM ORDER ONE 직원관리</title><style>
:root{--green:#188754;--green2:#0d6b45;--ink:#172033;--muted:#667085;--line:#d6e5dc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#dff3e8,#f4f8f6 42%);font-family:Arial,'Noto Sans KR',sans-serif;color:var(--ink)}.app{max-width:1400px;margin:auto;min-height:100vh}.top{padding:23px 20px;background:linear-gradient(135deg,#0c4c32,#188754 62%,#5abd86);color:#fff;box-shadow:0 7px 25px #0d6b4533}.brand{font-size:30px;font-weight:1000}.sub{font-size:17px;margin-top:7px}.badge{display:inline-block;margin-top:12px;padding:8px 14px;border:1px solid #ffffff55;border-radius:999px;background:#ffffff25;font-weight:900}.wrap{padding:16px}.card{background:#fff;border-radius:21px;padding:20px;margin-bottom:15px;box-shadow:0 12px 32px #146b4317}.title{font-size:25px;font-weight:1000;color:#0e5d3c}.desc{font-size:16px;color:var(--muted);margin-top:5px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat{padding:18px;border:2px solid #dcebe2;border-radius:17px;background:linear-gradient(180deg,#fff,#f5fbf7)}.stat span{display:block;color:var(--muted);font-weight:800}.stat b{display:block;font-size:32px;color:#0f7449;margin-top:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #b9d7c5;background:#fff;color:#155c3e;border-radius:13px;padding:13px 16px;font-size:16px;font-weight:900;cursor:pointer}.btn.main{background:linear-gradient(135deg,#2dac6d,#188754);border:0;color:#fff}.tablewrap{overflow:auto;border:1px solid #dce8e0;border-radius:15px}table{border-collapse:collapse;width:100%;min-width:1220px}th,td{padding:12px;border-bottom:1px solid #e5ede8;text-align:left;vertical-align:top;font-size:14px}th{position:sticky;top:0;background:#edf8f1;color:#145b3d;z-index:1}.status{display:inline-block;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:900}.status.new{background:#fff2c7;color:#815d00}.status.done{background:#ddf4e6;color:#126a40}.empty{text-align:center;padding:38px;color:var(--muted)}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.brand{font-size:26px}}
</style></head><body><div class="app"><header class="top"><div class="brand">RODEM ORDER ONE</div><div class="sub">고객 주문 취합 및 로젠 송장 관리 시스템</div><div class="badge">직원관리</div></header><main class="wrap"><div class="card"><div class="stats"><div class="stat"><span>전체 주문</span><b id="all">0</b></div><div class="stat"><span>신규 주문</span><b id="new">0</b></div><div class="stat"><span>송장 생성</span><b id="done">0</b></div><div class="stat"><span>총 낱개 수량</span><b id="qty">0</b></div></div></div><div class="card"><div class="toolbar"><button class="btn main" onclick="loadOrders()">새로고침</button><button class="btn main" onclick="exportLogen()">선택 주문 로젠 엑셀 생성</button><button class="btn" onclick="selectNew()">신규 주문 전체선택</button><button class="btn" onclick="toggleAll()">전체 선택/해제</button><button class="btn" onclick="exportBackup()">주문 백업 엑셀</button></div></div><div class="card"><div class="title">주문 목록</div><div class="desc" id="updated"></div><div class="tablewrap" style="margin-top:14px"><table><thead><tr><th><input type="checkbox" id="head" onchange="toggleAll(this.checked)"></th><th>상태</th><th>주문번호</th><th>접수시간</th><th>업체명</th><th>받는 분</th><th>연락처</th><th>주소</th><th>주문상품</th><th>총수량</th><th>배송 요청사항</th></tr></thead><tbody id="body"></tbody></table></div></div></main></div><script>
let orders=[];const $=id=>document.getElementById(id);async function loadOrders(){try{let r=await fetch('/api/staff/orders');if(!r.ok)throw new Error();let d=await r.json();orders=d.orders;render()}catch(e){alert('주문 정보를 불러오지 못했습니다.')}}function render(){let n=orders.filter(x=>x.status==='신규').length,d=orders.length-n,q=orders.reduce((s,x)=>s+Number(x.total_qty||0),0);$('all').textContent=orders.length;$('new').textContent=n;$('done').textContent=d;$('qty').textContent=q.toLocaleString();$('updated').textContent='마지막 새로고침: '+new Date().toLocaleString();$('body').innerHTML=orders.length?orders.map(o=>`<tr><td><input class="sel" type="checkbox" value="${o.id}"></td><td><span class="status ${o.status==='신규'?'new':'done'}">${esc(o.status)}</span></td><td>${esc(o.order_no)}</td><td>${esc(o.created_at)}</td><td><b>${esc(o.company)}</b></td><td>${esc(o.receiver)}</td><td>${esc(o.phone)}</td><td>${esc((o.postal_code||'')+' '+o.address)}</td><td>${o.items.map(i=>esc(i.name)+' '+Number(i.qty).toLocaleString()+'개').join('<br>')}</td><td><b>${Number(o.total_qty).toLocaleString()}개</b></td><td>${esc(o.memo||'')}</td></tr>`).join(''):`<tr><td colspan="11" class="empty">아직 접수된 주문이 없습니다.</td></tr>`}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function ids(){return [...document.querySelectorAll('.sel:checked')].map(x=>Number(x.value))}function toggleAll(v){let boxes=[...document.querySelectorAll('.sel')],checked=typeof v==='boolean'?v:!boxes.every(x=>x.checked);boxes.forEach(x=>x.checked=checked);$('head').checked=checked}function selectNew(){document.querySelectorAll('.sel').forEach(x=>{let o=orders.find(y=>y.id===Number(x.value));x.checked=!!(o&&o.status==='신규')})}async function download(path,body){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){let d=await r.json().catch(()=>({}));return alert(d.error||'파일 생성에 실패했습니다.')}let b=await r.blob(),name=(r.headers.get('content-disposition')||'').match(/filename="?([^";]+)"?/i)?.[1]||'download.xlsx',a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);await loadOrders()}function exportLogen(){let a=ids();if(!a.length)return alert('송장을 생성할 주문을 선택해 주세요.');download('/api/staff/export-logen',{ids:a})}function exportBackup(){download('/api/staff/export-backup',{})}loadOrders();setInterval(loadOrders,60000);
</script></body></html>
