<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#1768c4"><title>RODEM ORDER ONE</title><style>
:root{--blue:#1768c4;--blue2:#0c4a9a;--ink:#182033;--muted:#667085;--line:#d7e2ef;--bg:#eef5fd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#d7e9ff,#f5f8fc 42%);font-family:Arial,'Noto Sans KR',sans-serif;color:var(--ink)}.app{max-width:780px;margin:auto;min-height:100vh}.top{padding:25px 18px;background:linear-gradient(135deg,#0c376e,#1768c4 62%,#59a6f5);color:#fff;box-shadow:0 7px 25px #123a6d33}.brand{font-size:30px;font-weight:1000}.sub{font-size:17px;margin-top:7px}.badge{display:inline-block;margin-top:12px;padding:8px 14px;border:1px solid #ffffff55;border-radius:999px;background:#ffffff25;font-weight:900}.wrap{padding:14px}.card{background:#fff;border-radius:22px;padding:20px;margin-bottom:15px;box-shadow:0 12px 32px #16509118}.title{font-size:26px;font-weight:1000;margin-bottom:8px}.desc{font-size:18px;line-height:1.6;color:var(--muted)}label{font-size:19px;font-weight:900;display:block;margin:14px 0 8px}.field{width:100%;min-height:64px;padding:14px;border:2px solid var(--line);border-radius:15px;font-size:20px;background:#fff}.field:focus{outline:4px solid #1768c424;border-color:var(--blue)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{display:grid;grid-template-columns:1fr 125px;gap:10px;align-items:end;padding:13px 0;border-bottom:1px solid #e6edf5}.num{display:inline-flex;width:36px;height:36px;border-radius:11px;background:#e9f3ff;align-items:center;justify-content:center;color:#1459a8;font-weight:1000;margin-right:8px}.qty{text-align:center;font-weight:1000}.unit{text-align:center;color:var(--muted);font-size:14px;margin-top:5px}.btn{width:100%;min-height:72px;border:0;border-radius:18px;margin-top:16px;background:linear-gradient(135deg,#2d84e1,#1355aa);color:#fff;font-size:24px;font-weight:1000;box-shadow:0 10px 22px #1768c43d;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.saved{background:#f1f7ff;border:2px solid #d6e9ff;border-radius:17px;padding:17px;font-size:17px;line-height:1.7}.sum{padding:16px;border-radius:15px;background:#f7fbff;border:2px solid #dcecff;font-size:18px;line-height:1.7}.success{text-align:center;padding:40px 18px}.success .icon{font-size:70px}.success h1{font-size:30px}.hide{display:none!important}.notice{font-size:16px;padding:15px;border-radius:14px;background:#fff8d9;border:1px solid #eadb91;line-height:1.6}@media(max-width:600px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr 105px}.brand{font-size:26px}.card{padding:17px}.field{font-size:18px}.btn{font-size:22px}}
</style></head><body><div class="app"><header class="top"><div class="brand">RODEM ORDER ONE</div><div class="sub">누구나 쉽게 사용하는 로뎀푸드 간편 주문</div><div class="badge">주문하기</div></header><main class="wrap">
<section id="setup" class="hide"><div class="card"><div class="title">처음 한 번만 입력해 주세요</div><div class="desc">배송지와 담당자 정보를 저장하면 다음 주문부터 다시 입력하지 않아도 됩니다.</div></div><div class="card"><div class="grid"><div><label>업체명</label><input id="company" class="field" placeholder="예: 행복식당"></div><div><label>받는 분</label><input id="receiver" class="field" placeholder="예: 홍길동 점주"></div><div><label>담당자 연락처</label><input id="phone" class="field" inputmode="tel" placeholder="010-1234-5678"></div><div><label>우편번호</label><input id="postal_code" class="field" inputmode="numeric" placeholder="선택 입력"></div></div><label>배송지 주소</label><input id="address" class="field" placeholder="도로명 주소와 상세주소"><button id="saveBtn" class="btn" onclick="saveInfo()">배송지 정보 저장하기</button></div></section>
<section id="order" class="hide"><div class="card"><div class="title">주문하기</div><div class="desc">주문할 제품명과 낱개 수량을 입력해 주세요.</div></div><div class="card"><div class="saved" id="saved"></div></div><div class="card"><div id="rows"></div></div><div class="card"><label>배송 요청사항</label><textarea id="memo" class="field" rows="3" placeholder="예: 출고 전 연락 부탁드립니다"></textarea><div id="sum" class="sum" style="margin-top:14px">주문 제품을 입력해 주세요.</div><button id="orderBtn" class="btn" onclick="submitOrder()">주문 완료하기</button></div><div class="notice">배송지 변경이 필요한 경우 로뎀푸드 고객지원팀에 연락해 주세요.</div></section>
<section id="success" class="hide"><div class="card success"><div class="icon">✅</div><h1>주문이 정상접수 되었습니다.</h1><div id="successText" class="desc"></div><button class="btn" onclick="newOrder()">추가 주문하기</button></div></section>
</main></div><script>
const $=id=>document.getElementById(id);let customer=null;
function makeRows(){let h='';for(let i=1;i<=8;i++)h+=`<div class="item"><div><label><span class="num">${i}</span>제품명</label><input class="field product" placeholder="제품명을 입력하세요" oninput="updateSum()"></div><div><label>수량</label><input class="field qty" type="number" min="0" inputmode="numeric" placeholder="0" oninput="updateSum()"><div class="unit">낱개</div></div></div>`;$('rows').innerHTML=h}
async function init(){makeRows();try{let r=await fetch('/api/customer/me');let d=await r.json();if(d.customer){customer=d.customer;showOrder()}else $('setup').classList.remove('hide')}catch(e){alert('서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.')}}
async function saveInfo(){let body={company:$('company').value.trim(),receiver:$('receiver').value.trim(),phone:$('phone').value.trim(),postal_code:$('postal_code').value.trim(),address:$('address').value.trim()};if(!body.company||!body.receiver||!body.phone||!body.address)return alert('업체명, 받는 분, 연락처, 배송지 주소를 입력해 주세요.');$('saveBtn').disabled=true;try{let r=await fetch('/api/customer/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw new Error(d.error||'저장하지 못했습니다.');customer=d.customer;$('setup').classList.add('hide');showOrder()}catch(e){alert(e.message)}finally{$('saveBtn').disabled=false}}
function showOrder(){$('order').classList.remove('hide');$('saved').innerHTML=`<b>${esc(customer.company)}</b><br>${esc(customer.receiver)} · ${esc(customer.phone)}<br>${esc(customer.postal_code||'')} ${esc(customer.address)}`}
function items(){return [...document.querySelectorAll('.item')].map(x=>({name:x.querySelector('.product').value.trim(),qty:Number(x.querySelector('.qty').value||0)})).filter(x=>x.name&&x.qty>0)}
function updateSum(){let a=items(),t=a.reduce((s,x)=>s+x.qty,0);$('sum').innerHTML=a.length?`주문 품목 <b>${a.length}개</b><br>총 주문수량 <b>${t.toLocaleString()}개</b>`:'주문 제품을 입력해 주세요.'}
async function submitOrder(){let a=items();if(!a.length)return alert('제품명과 주문 수량을 한 개 이상 입력해 주세요.');if(!confirm('입력한 내용으로 주문하시겠습니까?'))return;$('orderBtn').disabled=true;try{let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:a,memo:$('memo').value.trim()})});let d=await r.json();if(!r.ok)throw new Error(d.error||'주문 접수에 실패했습니다.');$('order').classList.add('hide');$('success').classList.remove('hide');$('successText').innerHTML=`주문번호 <b>${esc(d.order_no)}</b><br>총 ${Number(d.total_qty).toLocaleString()}개가 접수되었습니다.`;window.scrollTo(0,0)}catch(e){alert(e.message)}finally{$('orderBtn').disabled=false}}
function newOrder(){document.querySelectorAll('.product,.qty').forEach(x=>x.value='');$('memo').value='';updateSum();$('success').classList.add('hide');$('order').classList.remove('hide');window.scrollTo(0,0)}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}init();
</script></body></html>
