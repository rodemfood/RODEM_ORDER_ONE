<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1768c4">
<title>RODEM ORDER ONE</title>
<script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>
:root{--blue:#1768c4;--blue2:#0c4a9a;--ink:#172033;--muted:#667085;--line:#d7e2ef;--bg:#eef5fd;--danger:#c92a2a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#d9eaff,#f7f9fc 45%);font-family:Arial,'Noto Sans KR',sans-serif;color:var(--ink)}button,input,textarea{font-family:inherit}.app{max-width:760px;margin:auto;min-height:100vh}.top{padding:26px 19px;background:linear-gradient(135deg,#0b376f,#1768c4 62%,#58a5f4);color:#fff;box-shadow:0 8px 28px #123a6d35}.brand{font-size:31px;font-weight:1000;letter-spacing:.2px}.sub{font-size:18px;margin-top:8px}.badge{display:inline-block;margin-top:13px;padding:9px 15px;border:1px solid #ffffff66;border-radius:999px;background:#ffffff25;font-size:17px;font-weight:900}.wrap{padding:15px}.card{background:#fff;border-radius:22px;padding:21px;margin-bottom:15px;box-shadow:0 12px 34px #16509118}.title{font-size:27px;font-weight:1000;color:#114f98;margin-bottom:8px}.desc{font-size:18px;line-height:1.55;color:var(--muted)}label{display:block;margin:15px 0 7px;font-size:19px;font-weight:900}.field{width:100%;height:58px;border:2px solid var(--line);border-radius:14px;padding:0 15px;font-size:20px;background:#fbfdff;outline:none}.field:focus{border-color:#2b7fd5;box-shadow:0 0 0 4px #2b7fd51b}.area{height:100px;padding:13px;resize:vertical}.btn{width:100%;min-height:65px;border:0;border-radius:15px;background:linear-gradient(135deg,#2d82d8,#1768c4);color:#fff;font-size:23px;font-weight:1000;cursor:pointer;box-shadow:0 8px 18px #1768c43a}.btn:disabled{opacity:.55;cursor:wait}.item{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px;padding:16px 0;border-bottom:1px solid #e7eef7}.item:last-child{border-bottom:0}.num{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;background:#e7f1fd;color:#155eb1;border-radius:50%;margin-right:7px}.unit{text-align:right;color:var(--muted);font-weight:800;margin-top:5px}.saved{padding:14px;border-radius:14px;background:#eef6ff;font-size:18px;line-height:1.55}.sum{margin:17px 0;padding:15px;border-radius:14px;background:#f2f7fd;font-size:20px;line-height:1.6}.sum b{color:#155eb1}.notice{padding:14px;border-radius:14px;background:#fff8df;color:#735d09;font-size:16px;line-height:1.55}.success{text-align:center;padding:34px 22px}.success .icon{font-size:65px}.success h1{font-size:29px;color:#1268bd}.hide{display:none!important}.error{color:var(--danger);font-weight:800;margin-top:10px}.small{font-size:15px;color:var(--muted);line-height:1.5;margin-top:10px}.address-row{display:grid;grid-template-columns:1fr 150px;gap:10px}.search-btn{height:58px;border:0;border-radius:14px;background:#1768c4;color:#fff;font-size:19px;font-weight:1000;cursor:pointer}.readonly{background:#f4f7fb;color:#344054}.postcode-note{margin-top:8px;font-size:15px;color:var(--muted)}@media(max-width:620px){.address-row{grid-template-columns:1fr 125px}.search-btn{font-size:17px}.brand{font-size:27px}.title{font-size:24px}.wrap{padding:11px}.card{padding:17px;border-radius:18px}.item{grid-template-columns:minmax(0,1fr) 115px;gap:9px}.field{height:56px;font-size:19px}.btn{font-size:21px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">RODEM ORDER ONE</div><div class="sub">로뎀푸드 간편 주문 시스템</div><div class="badge">주문하기</div></header>
<main class="wrap">
<section id="setup" class="hide">
  <div class="card"><div class="title">배송지 최초 등록</div><div class="desc">처음 한 번만 입력하면 다음 주문부터 자동으로 불러옵니다.</div>
    <label>업체명</label><input id="company" class="field" autocomplete="organization" placeholder="예: 행복식당">
    <label>받는 분</label><input id="receiver" class="field" autocomplete="name" placeholder="예: 홍길동">
    <label>연락처</label><input id="phone" class="field" inputmode="tel" autocomplete="tel" placeholder="예: 010-1234-5678">
    <label>배송지 주소</label>
    <div class="address-row">
      <input id="address" class="field readonly" autocomplete="street-address" placeholder="주소 검색을 눌러 주세요" readonly>
      <button type="button" class="search-btn" onclick="openPostcode()">주소 검색</button>
    </div>
    <input id="postal_code" type="hidden">
    <div class="postcode-note">주소를 선택하면 우편번호가 자동으로 저장됩니다.</div>
    <label>상세주소</label><input id="detail_address" class="field" autocomplete="address-line2" placeholder="예: 3층 또는 101호">
    <div id="setupError" class="error"></div><button id="saveBtn" class="btn" onclick="saveInfo()">배송지 저장하기</button>
  </div>
</section>
<section id="order" class="hide">
  <div class="card"><div class="title">저장된 배송지</div><div id="saved" class="saved"></div><div class="small">배송지 변경은 고객지원팀에 요청해 주세요.</div></div>
  <div class="card"><div class="title">주문 제품</div><div class="desc">제품명과 주문할 낱개 수량을 입력해 주세요.</div><div id="rows"></div>
    <label>배송 요청사항</label><textarea id="memo" class="field area" maxlength="500" placeholder="예: 부재 시 경비실에 맡겨주세요."></textarea>
    <div id="sum" class="sum">주문 제품을 입력해 주세요.</div><div id="orderError" class="error"></div>
    <button id="orderBtn" class="btn" onclick="submitOrder()">주문 완료하기</button>
  </div>
  <div class="notice">주문 수량은 박스가 아니라 <b>낱개 단위</b>입니다. 제품명과 수량을 다시 확인해 주세요.</div>
</section>
<section id="success" class="hide"><div class="card success"><div class="icon">✅</div><h1>주문이 정상접수 되었습니다.</h1><div id="successText" class="desc"></div><button class="btn" onclick="newOrder()">추가 주문하기</button></div></section>
</main></div>
<script>
const $=id=>document.getElementById(id);let customer=null;let sending=false;
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function makeRows(){let h='';for(let i=1;i<=8;i++)h+=`<div class="item"><div><label><span class="num">${i}</span>제품명</label><input class="field product" maxlength="100" placeholder="제품명 입력" oninput="updateSum()"></div><div><label>낱개 수량</label><input class="field qty" type="number" min="0" max="999999" inputmode="numeric" placeholder="0" oninput="updateSum()"><div class="unit">개</div></div></div>`;$('rows').innerHTML=h}
async function init(){makeRows();try{let r=await fetch('/api/customer/me',{cache:'no-store'});let d=await r.json();if(d.customer){customer=d.customer;showOrder()}else $('setup').classList.remove('hide')}catch(e){$('setup').classList.remove('hide');$('setupError').textContent='서버 연결을 확인해 주세요.'}}
function openPostcode(){
  $('setupError').textContent='';
  if(!(window.kakao&&window.kakao.Postcode)){
    $('setupError').textContent='주소 검색 서비스를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
    return;
  }
  new kakao.Postcode({
    oncomplete:function(data){
      const base=data.roadAddress||data.jibunAddress||data.address||'';
      $('postal_code').value=data.zonecode||'';
      $('address').value=base;
      $('detail_address').focus();
    }
  }).open();
}
async function saveInfo(){
  const baseAddress=$('address').value.trim();
  const detailAddress=$('detail_address').value.trim();
  let body={company:$('company').value.trim(),receiver:$('receiver').value.trim(),phone:$('phone').value.trim(),postal_code:$('postal_code').value.trim(),address:[baseAddress,detailAddress].filter(Boolean).join(' ')};
  $('setupError').textContent='';
  if(!body.company||!body.receiver||!body.phone||!baseAddress){$('setupError').textContent='업체명, 받는 분, 연락처, 배송지 주소를 모두 입력해 주세요.';return}
  $('saveBtn').disabled=true;
  try{let r=await fetch('/api/customer/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw new Error(d.error||'저장하지 못했습니다.');customer=d.customer;$('setup').classList.add('hide');showOrder()}catch(e){$('setupError').textContent=e.message}finally{$('saveBtn').disabled=false}
}
function showOrder(){$('order').classList.remove('hide');$('saved').innerHTML=`<b>${esc(customer.company)}</b><br>${esc(customer.receiver)} · ${esc(customer.phone)}<br>${esc(customer.postal_code||'')} ${esc(customer.address)}`}
function items(){return [...document.querySelectorAll('.item')].map(x=>({name:x.querySelector('.product').value.trim().replaceAll('#',''),qty:Number(x.querySelector('.qty').value||0)})).filter(x=>x.name&&x.qty>0)}
function updateSum(){let a=items(),t=a.reduce((s,x)=>s+x.qty,0);$('sum').innerHTML=a.length?`주문 품목 <b>${a.length}개</b><br>총 낱개 수량 <b>${t.toLocaleString()}개</b>`:'주문 제품을 입력해 주세요.'}
function requestId(){return 'web-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
async function submitOrder(){if(sending)return;let a=items();$('orderError').textContent='';if(!a.length){$('orderError').textContent='제품명과 주문 수량을 한 개 이상 입력해 주세요.';return}let summary=a.map(x=>`${x.name} ${x.qty.toLocaleString()}개`).join('\n');if(!confirm(`아래 내용으로 주문하시겠습니까?\n\n${summary}`))return;sending=true;$('orderBtn').disabled=true;try{let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:requestId(),items:a,memo:$('memo').value.trim()})});let d=await r.json();if(!r.ok)throw new Error(d.error||'주문 접수에 실패했습니다.');$('order').classList.add('hide');$('success').classList.remove('hide');$('successText').innerHTML=`주문번호 <b>${esc(d.order_no)}</b><br>총 ${Number(d.total_qty).toLocaleString()}개가 접수되었습니다.`;window.scrollTo(0,0)}catch(e){$('orderError').textContent=e.message}finally{sending=false;$('orderBtn').disabled=false}}
function newOrder(){document.querySelectorAll('.product,.qty').forEach(x=>x.value='');$('memo').value='';updateSum();$('success').classList.add('hide');$('order').classList.remove('hide');window.scrollTo(0,0)}
init();
</script>
</body></html>
